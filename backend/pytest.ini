[pytest]
minversion = 8.0
addopts = -ra -q --strict-markers
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    live: live external integration tests against real services (Neon, Qdrant, Gemini, S3)
filterwarnings =


    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::sqlalchemy.exc.SAWarning
